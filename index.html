<title>Impact Anim Brico</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#f5f5f5;
color:#333;
}

/* HERO */
.hero{
background:url("https://raw.githubusercontent.com/lila35240-bit/impact-anim-brico/main/photo1.jpg") center/cover no-repeat;
height:90vh;
display:flex;
align-items:center;

text-align:center;

}

.hero h1{
font-size:48px;
background:rgba(0,0,0,0.5);

/* SECTION */
section{
max-width:1100px;
margin:auto;
padding:60px 20px;
}

h2{
text-align:center;
margin-bottom:40px;
}

/* GALERIE */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.grid img{
width:100%;
border-radius:12px;
}

/* CONTACT */
.contact{
background:#ff6600;
color:white;
text-align:center;
padding:50px 20px;
}

.btn{
display:inline-block;
background:white;
color:#ff6600;
padding:15px 25px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
margin-top:15px;
}

/* WHATSAPP FLOAT */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px 18px;
border-radius:50px;
font-weight:bold;
text-decoration:none;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
}
